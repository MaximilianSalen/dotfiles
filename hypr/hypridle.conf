general {
    lock_cmd = pidof hyprlock || hyprlock
    # Close the VPN cleanly before sleep — a session carried into suspend goes
    # stale and blocks reconnects for ~3 min after resume (charon-nm retransmits)
    before_sleep_cmd = loginctl lock-session; ~/.local/bin/vpn-suspend.sh pre
    after_sleep_cmd = hyprctl dispatch dpms on; ~/.local/bin/vpn-suspend.sh post
}

# Dim screen after 3 minutes
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

# Screen blank + lock after 5 minutes (matches GNOME: 300s blank, 0s lock delay)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Idle suspend disabled 2026-07-28: locked-but-awake keeps the Embedl VPN alive
# (suspend killed it — FortiGate DPD + NAT expiry). Lid close still suspends,
# and the vpn-suspend.sh hooks handle the VPN around those suspends.
# To restore: re-add listener { timeout = 900, on-timeout = [ $(cat
# /sys/class/power_supply/*/online 2>/dev/null | head -1) = "0" ] && systemctl suspend }
